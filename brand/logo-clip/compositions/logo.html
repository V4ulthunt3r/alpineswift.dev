        const m = outCubic(seg(0, 900));
        clipR.setAttribute("y", 1100 - 540 * m);
        mtn.setAttribute("transform", `translate(0 ${(36 * (1 - m)).toFixed(1)})`);
        const f = seg(600, 1100);
        facet.setAttribute("transform", `translate(665 740) scale(${outBack(f).toFixed(3)}) translate(-665 -740)`);
        const g = seg(700, 1500);
        glint.setAttribute("stroke-dashoffset", 150 - 1500 * outCubic(g));
        glint.setAttribute("opacity", g > 0 && g < 1 ? Math.sin(Math.PI * g).toFixed(3) : 0);
        const bRaw = seg(600, END), b = outQuint(bRaw);
        const ang = (Math.atan2(bezD(BY, b), bezD(BX, b)) * 180) / Math.PI;
        const rot = (ang - HEADING) * (1 - clamp((bRaw - 0.82) / 0.18, 0, 1));
        const sc = 0.55 + 0.45 * b, flick = 1 + 0.07 * Math.sin(t / 34) * (1 - b);
        bird.setAttribute("transform", `translate(${bez(BX, b).toFixed(1)} ${bez(BY, b).toFixed(1)}) rotate(${rot.toFixed(2)} ${CX} ${CY}) translate(${CX} ${CY}) scale(${(sc * flick).toFixed(3)} ${sc.toFixed(3)}) translate(${-CX} ${-CY})`);
        bird.setAttribute("opacity", Math.min(1, bRaw * 8));
        wing.setAttribute("opacity", seg(1950, 2300).toFixed(3));
      }

      // Layout comes from the host (data-variable-values): wide = mark left of the wordmark; square and
      // portrait = mark stacked above it. All numbers are canvas pixels.
      const LAYOUTS = {
        wide: { from: { x: 594, y: 0, scale: 1.7 }, letter: { x: -70, y: 0 } },
        square: { mark: [330, 280, 420, 391], word: [728, 84], from: { x: 0, y: 64.5, scale: 1.3 }, letter: { x: 0, y: -40 } },
        portrait: { mark: [280, 645, 520, 484], word: [1195, 92], from: { x: 0, y: 73, scale: 1.3 }, letter: { x: 0, y: -44 } },
      };
      const L = LAYOUTS[window.__hyperframes.getVariables().layout] || LAYOUTS.wide;
      if (L.mark) {
        const mk = $("lg-mark").style, wd = $("lg-word").style, px = (n) => n + "px";
        [mk.left, mk.top, mk.width, mk.height] = L.mark.map(px);
        wd.left = "0"; wd.width = "100%"; wd.textAlign = "center";
        wd.top = px(L.word[0]); wd.height = wd.lineHeight = wd.fontSize = px(L.word[1]);
      }

      const tl = gsap.timeline({ paused: true });

      // 0 – 2.3 s: peak rises, glacier facet pops, the swift flies in and lands
      tl.fromTo(state, { ms: 0 }, { ms: END, duration: END / 1000, ease: "none", onUpdate: drawMark }, 0);

      // contour lines draw on behind it, outermost last
      tl.fromTo(".lg-contour", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.6, ease: "power2.out", stagger: 0.06 }, 0);

      // 2.45 s: the mark gives way from the centre into the lockup …
      tl.fromTo("#lg-mark-move", L.from, { x: 0, y: 0, scale: 1, duration: 0.85, ease: "power3.inOut" }, 2.45);

      // … and the wordmark comes out from behind it, letter by letter
      tl.fromTo(".lg-l", { opacity: 0, x: L.letter.x, y: L.letter.y, filter: "blur(10px)" }, { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power4.out", stagger: 0.035 }, 2.85);

      drawMark();
      window.__timelines["logo"] = tl;
    })();
  </script>
</template>
